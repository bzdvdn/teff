[project]
name = "teff"
version = "0.1.0"
description = "Workflow as data. Agents as graphs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "agents", "workflow", "llm", "graph", "orchestration", "rag", "durable", "yaml", "checkpoint", "human-in-the-loop", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "jsonschema>=4.18,<5.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
]

[project.urls]
Homepage = "https://bzdvdn.github.io/teff/"
Documentation = "https://bzdvdn.github.io/teff/"
Repository = "https://github.com/bzdvdn/teff"
Changelog = "https://github.com/bzdvdn/teff/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/bzdvdn/teff/releases"
Source = "https://github.com/bzdvdn/teff"
Issues = "https://github.com/bzdvdn/teff/issues"

[project.optional-dependencies]
stores-qdrant = [
    "qdrant-client>=1.9",
]
stores-chroma = [
    "chromadb>=0.5",
]
stores-pgvector = [
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "pgvector>=0.2",
]
stores-faiss = [
    "faiss-cpu>=1.7",
]
stores-lance = [
    "lancedb>=0.26",
]
stores-milvus = [
    "pymilvus>=2.4",
]
stores-weaviate = [
    "weaviate-client>=4.4",
]
stores-pinecone = [
    "pinecone>=5.0",
]
# Install every store at once (the heavy default — prefer one `stores-*`
# extra per image so the vector-store deps stay small).
embedding = [
    "teff[stores-qdrant,stores-chroma,stores-pgvector,stores-faiss,stores-lance,stores-milvus,stores-weaviate,stores-pinecone]",
]
rag-pdf = [
    "pypdf>=4.0",
]
rag-excel = [
    "openpyxl>=3.1",
]
pg-checkpoint = [
    "asyncpg>=0.29",
]
tools = [
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "boto3>=1.34",
    "slack-sdk>=3.27",
    "psycopg>=3.1",
    "redis>=5.0",
]
# MCP client support (stdlib + streamable-http). Kept out of the core so the
# base install stays light — `mcp` pulls in fastapi/uvicorn/starlette.
mcp = [
    "mcp>=2.0,<3.0",
]
fastapi = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]
# Channel adapters (HTTP/SSE + webhooks) over a workflow YAML. The core
# channel package (factory, webhook, telegram) imports with stdlib + httpx
# only; the HTTP/SSE surface needs this extra.
channels = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]
observability = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
queue = [
    "celery[redis]>=5.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
]
all = [
    "teff[embedding,tools,mcp,rag-pdf,rag-excel,pg-checkpoint,fastapi,channels,queue,observability]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["teff/scaffold/_common", "teff/scaffold/fastapi", "teff/scaffold/cli", "teff/scaffold/daemon", "examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["teff"]
# External vector-store backends require heavy dependencies / live services
# and are covered via `teff[stores-*]` extras + smoke tests; the stdlib
# stores (memory, sqlite) are measured.
omit = [
    "teff/scaffold/*",
    "teff/_version.py",
    "teff/rag/stores/chroma.py",
    "teff/rag/stores/faiss.py",
    "teff/rag/stores/lance.py",
    "teff/rag/stores/milvus.py",
    "teff/rag/stores/pgvector.py",
    "teff/rag/stores/pinecone.py",
    "teff/rag/stores/qdrant.py",
    "teff/rag/stores/weaviate.py",
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["examples/", "site/"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
teff = "teff.cli:app"

[project.entry-points.pytest11]
teff = "teff.testing"

[tool.hatch.build.targets.wheel]
packages = ["teff/"]
