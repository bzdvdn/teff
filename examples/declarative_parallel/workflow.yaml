name: declarative-parallel
description: >
  Parallel fan-out expressed entirely in YAML — no Python. One input is
  processed by three concurrent branches (each an isolated state copy);
  their results merge back into state via the default override reducers,
  then a final transform closes the run.

  Run: teff run --file workflow.yaml
state:
  initial:
    text: "  hello teff  "

steps:
  - parallel:
      id: fanout
      branches:
        - transform: {action: uppercase, input_key: text, output_key: upper}
        - transform: {action: count_lines, input_key: text, output_key: lines}
        - transform: {action: trim, input_key: text, output_key: trimmed}

  - transform: {id: report, action: value, value: done, output_key: status}
