name: text-pipeline
description: >
  A zero-dependency pipeline (no API key needed) that chains
  transform operations. Trims whitespace, uppercases, and counts lines.

state:
  initial:
    title: "  hello world  "

steps:
  - transform: {id: trim, action: trim, input_key: title, output_key: trimmed}
  - transform: {id: uppercase, action: uppercase, input_key: trimmed, output_key: loud}
  - transform: {id: count, action: count_lines, input_key: loud, output_key: line_count}
