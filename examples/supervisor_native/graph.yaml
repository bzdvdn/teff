name: supervisor_native
description: >-
  The minimal route() supervisor built from the raw building blocks instead
  of the `team:` idiom — a `supervisor:` decider node plus an explicit
  `supervise:` loop.  Same shape as examples/simple_router_yaml, but the
  decider and the routing loop are separate steps, so the Supervisor's full
  surface (fill_order, sections, finish token, output_key) is exposed and
  the agent roles can be defined inline or referenced elsewhere.

state:
  schema:
    messages:
      reducer: append
      type: list
  initial:
    messages: []
    next_agent: ""
    supervisor_rounds: 0
    code: ""
    talk: ""
    delivered_at: ""

providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat
steps:
  - id: lead
    type: supervisor
    config:
      system: |-
        You are a router. Your job is to pick the agent that fits the user's message.

        Agents:
        - coder — a question about code, Python or programming
        - talk — anything else (small talk, general questions)
        - finish — the conversation is already answered and done

        The message includes the current round and the user's request.  Reply with
        exactly ONE word: coder, talk or finish.

        Rules:
        - No punctuation, no quotes, no explanation — only the single word.
        - If an agent already answered and the user only confirms or continues the
          same topic, return: finish.
        - Never invent agents that are not listed above.
      model: llama3.1:8b
      provider: ollama
      route_keys: {coder: code, talk: talk}
      done_keys: [code, talk]
      done_mode: any
      fallback_agent: talk
      max_rounds: 6

  - id: coder
    type: subflow
    config:
      build:
        type: agent_step
        system: |-
          You are a concise Python coding assistant.

          Rules:
          - Reply with the code and a one-line explanation.
          - Start directly with the code block; no preamble such as "Sure!".
          - Never invent functions or libraries.
        output_key: code
        model: llama3.1:8b
        provider: ollama
        messages_key: messages

  - id: talk
    type: subflow
    config:
      build:
        type: agent_step
        system: |-
          You are a friendly chat assistant.

          Rules:
          - Reply briefly and warmly.
          - Never invent facts.
          - Start directly with your reply; no preamble.
        output_key: talk
        model: llama3.1:8b
        provider: ollama
        messages_key: messages

  - id: done
    type: transform
    config:
      action: now
      output_key: delivered_at

edges:
  - from: lead
    to: coder
    condition: next_agent=coder
  - from: lead
    to: talk
    condition: next_agent=talk
  - from: lead
    to: done
    condition: next_agent=finish
  - from: coder
    to: lead
  - from: talk
    to: lead
