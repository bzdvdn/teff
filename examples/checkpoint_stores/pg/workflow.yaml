name: durable-pg
plugins: [../failing.py]
checkpoint:
  type: pg
  dsn: postgresql://postgres:postgres@localhost:5433/postgres
  checkpoint_id: demo-run
state:
  initial:
    text: durable
steps:
  - transform: {id: shout, action: uppercase, input_key: text, output_key: shout}
  - type: {type: failing}
  - transform: {id: done, action: value, value: finished, output_key: status}
