name: plugins-agent
description: >-
  ReAct agent that can use the custom tools from the `plugins/` folder
  (`word_count`, `slugify`) on top of the built-ins.  Same plugin
  discovery as workflow.yaml - the only difference is an LLM in the loop,
  so this one needs Ollama running with llama3.1:8b:

      ollama pull llama3.1:8b
      teff daemon -f workflow-agent.yaml --once

default_provider: ollama
default_model: llama3.1:8b

steps:
  - agent_step:
      id: agent
      system: >-
        You have two extra tools: word_count and slugify.  Use them when
        the user asks about word counts or URL slugs.
      output_key: answer
      use_tools: all
