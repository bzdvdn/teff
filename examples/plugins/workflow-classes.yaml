name: plugins-classes
description: >-
  Class-based plugins.  `plugins/classes.py` registers a Tool subclass
  (`upper`) and a Node subclass (`uppercase_node`) imperatively - no
  decorators.  No network, no API key.

state:
  initial:
    body: "hello plugins"

tools:
  - type: upper

steps:
  - type:
      type: uppercase_node
      config:
        input_key: body
        output_key: shouted
