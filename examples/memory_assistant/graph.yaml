name: memory_assistant
description: >-
  A ReAct agent with long-term memory. Facts are stored per user via the
  `memory` tool; on every turn the top-k recalled memories for the last
  user message are prepended to the LLM call through the react_agent's
  `memory:` config (context injection).

# ${USER_ID} is resolved from the environment at load time (see the
# "${ENV}" interpolation section in docs/guide/yaml-workflows.md). Use a
# static namespace like ["users", "ana"] if you don't want a per-user split.
state:
  schema:
    messages:
      reducer: append
      type: list
      extra_keys: true
  initial:
    messages: []
    input: ""
    output: ""

providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat

# The `memory` tool lets the agent write facts itself.
tools:
  - type: memory
    config:
      store: { type: sqlite, path: ./memory.db, dim: 768 }
      embedder: { provider: ollama, model: nomic-embed-text }
      namespace: ["users", "${USER_ID}"]
      similarity_threshold: 0.6
      default_k: 5

steps:
  - id: agent
    type: react_agent
    config:
      model: llama3.1:8b
      provider: ollama
      system: |-
        You are a personal assistant with long-term memory about the user.
        A "Relevant memories:" block is prepended to each turn automatically
        — use those facts.  Use the `memory` tool (action=remember) when
        the user reveals something durable worth keeping.
      input_key: input
      output_key: output
      messages_key: messages
      use_tools: [memory]
      # Context injection: same Store config as the tool above; the embedder
      # can omit base_url because it inherits it from the ollama provider.
      memory:
        store: { type: sqlite, path: ./memory.db, dim: 768 }
        embedder: { provider: ollama, model: nomic-embed-text }
        namespace: ["users", "${USER_ID}"]
        k: 5
        header: "Relevant memories:"

  - id: exec
    type: tool_exec

edges:
  - from: agent
    to: exec
    condition: _tool_call_name!=
  - from: exec
    to: agent