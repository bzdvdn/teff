name: channels_supervisor
description: >-
  The multi-agent supervisor (planner + coder + quality gate) reachable over
  every channel — HTTP/SSE, a generic webhook, a Telegram bot, and plain
  terminal chat (`teff chat`) — from ONE workflow.yaml.  The channels: block
  is the single source of truth for which adapters run; the graph itself is
  the same supervisor from examples/supervisor_complex.

  Team (included files under team/):
     supervisor (team lead)
        ├─ planner → plan   ├─ coder → code   └─ finish → quality gate
     review_quality ─► verdict ─► route
        │ pass ─────────────► approve (interrupt: approve / отлично / ok)
        └ needs_work ─► refine(loop: Map fixes in parallel, rewrite, re-review)

  Ask the bot in Russian to implement something; it plans, codes, reviews,
  and when a pause is needed the interrupt asks in-channel and resumes on
  your answer — identical on HTTP, webhook, Telegram and the terminal.

  Run any transport:

      teff chat  examples/channels/supervisor/workflow.yaml            # terminal
      teff serve examples/channels/supervisor/workflow.yaml            # HTTP + webhook
      TELEGRAM_BOT_TOKEN=... teff bot examples/channels/supervisor/workflow.yaml

state:
  schema:
    messages:
      reducer: append
      type: list
  initial:
    messages: []
    next_agent: ""
    supervisor_rounds: 0
    plan: ""
    code: ""
    critique: {}
    verdict: ""
    issues: []
    fixes: []
    decision: ""
    approved: ""
    delivered_at: ""

providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat

checkpoint:
  type: file
  path: data/checkpoints

channels:
  server:
    host: 127.0.0.1
    port: 8000
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    mode: polling
  webhook:
    - path: /hooks/implement
      schema:
        type: object
        properties:
          task:
            type: string
        required: [task]
      input:
        message: "Реализуй: {task}"
      session_key: task
      owner: "header.X-User-Id"

include:
  - path: team/lead.yaml
  - path: team/planner.yaml
  - path: team/coder.yaml

steps:
  - id: review_quality
    type: llm_chat
    config:
      provider: ollama
      model: llama3.1:8b
      system: >-
        You are a strict code reviewer. Review the code and reply with a
        single JSON object:
        {{ "verdict": "pass" or "needs_work", "issues": [list of short problems to fix] }}.
      prompt: "Review the code:\n\n{code}\n\nReply with JSON."
      output_key: critique
      parse: true

  - id: extract_verdict
    type: transform
    config:
      action: json_get
      input_key: critique
      field: verdict
      output_key: verdict

  - id: route
    type: command
    config:
      routes:
        - {when: "verdict=pass", goto: approve}
        - {when: "verdict=needs_work", goto: refine}
      goto: refine

  - id: refine
    type: loop
    config:
      key: verdict
      until: pass
      max_rounds: 3
      body:
        - {type: transform, action: pick, input_key: critique, field: issues, output_key: issues, raw: true}
        - type: map
          input_keys: [issues]
          output_key: fixes
          max_concurrency: 2
          processor:
            type: llm_chat
            provider: ollama
            model: llama3.1:8b
            system: "You fix exactly one code issue. Reply with only the corrected code."
            prompt: "Issue: {issues}\n\nCode:\n{code}"
            output_key: fix
        - {type: transform, action: join, input_key: fixes, sep: "\n\n", output_key: fixes_text}
        - type: llm_chat
          provider: ollama
          model: llama3.1:8b
          system: >-
            You apply the reviewer's fixes to the existing code and reply
            with the full corrected code.
          prompt: "Fixes:\n{fixes_text}\n\nCurrent code:\n{code}"
          output_key: code
        - type: llm_chat
          provider: ollama
          model: llama3.1:8b
          system: >-
            You are a strict code reviewer. Return a single JSON object:
            {{ "verdict": "pass" or "needs_work", "issues": [list of problems to fix] }}.
          prompt: "Review the corrected code:\n\n{code}\n\nReply with JSON."
          output_key: critique
          parse: true
        - {type: transform, action: json_get, input_key: critique, field: verdict, output_key: verdict}

  - id: approve
    type: interrupt
    config:
      key: approved
      prompt: "Отправить код в работу? (approve / отлично / ok — да; любое другое — на доработку)"
      strategy:
        any_of: [approve, отлично, ok]
        decision_key: decision
        pass_value: approve
        fail_value: rework

  - id: deliver
    type: command
    config:
      routes:
        - {when: "decision=approve", goto: final}
        - {when: "decision=rework", goto: refine}
      goto: STOP

  - id: final
    type: transform
    config:
      action: now
      output_key: delivered_at

edges:
  - {from: supervisor, to: planner, condition: "next_agent=planner"}
  - {from: supervisor, to: coder, condition: "next_agent=coder"}
  - {from: supervisor, to: review_quality, condition: "next_agent=finish"}
  - {from: planner, to: supervisor}
  - {from: coder, to: supervisor}
  - {from: review_quality, to: extract_verdict}
  - {from: extract_verdict, to: route}
  - {from: refine, to: approve}
  - {from: approve, to: deliver}
