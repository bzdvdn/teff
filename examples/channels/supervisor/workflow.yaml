name: channels_supervisor
description: >-
  The multi-agent supervisor (planner + coder + quality gate) reachable over
  every channel — HTTP/SSE, a generic webhook, a Telegram bot, and plain
  terminal chat (`teff chat`) — from ONE workflow.yaml.  The channels: block
  is the single source of truth for which adapters run; the graph itself is
  the same supervisor from examples/supervisor_complex.

  Team:
     supervisor (team lead)
        ├─ planner → plan   ├─ coder → code   └─ finish → quality gate
     review_quality ─► verdict ─► route
        │ pass ─────────────► approve (interrupt: approve / отлично / ok)
        └ needs_work ─► refine(loop: Map fixes in parallel, rewrite, re-review)

  Ask the bot in Russian to implement something; it plans, codes, reviews,
  and when a pause is needed the interrupt asks in-channel and resumes on
  your answer — identical on HTTP, webhook, Telegram and the terminal.

  Run any transport:

      teff chat  examples/channels/supervisor/workflow.yaml            # terminal
      teff serve examples/channels/supervisor/workflow.yaml            # HTTP + webhook
      TELEGRAM_BOT_TOKEN=... teff bot examples/channels/supervisor/workflow.yaml

state:
  schema:
    messages:
      reducer: append
      type: list
  initial:
    messages: []
    next_agent: ""
    supervisor_rounds: 0
    plan: ""
    code: ""
    critique: {}
    verdict: ""
    issues: []
    fixes: []
    decision: ""
    approved: ""
    delivered_at: ""

default_provider: ollama
default_model: llama3.1:8b

providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat

checkpoint:
  type: file
  path: data/checkpoints

channels:
  server:
    host: 127.0.0.1
    port: 8000
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    mode: polling
  webhook:
    - path: /hooks/implement
      schema:
        type: object
        properties:
          task:
            type: string
        required: [task]
      input:
        message: "Реализуй: {task}"
      session_key: task
      owner: "header.X-User-Id"

steps:
  - team:
      id: supervisor
      leader:
        system: >-
          You are the team lead of a software team. Your team:

          - planner — decomposes the user's request into a concrete plan
          - coder — writes the implementation described by the plan
          - finish — the work is complete, move on

          The message includes the work already produced and the current
          round. Reply with exactly ONE word: planner, coder or finish.

          Rules:
          - No punctuation, no quotes, no explanation — only the single word.
          - First route to planner (nothing planned yet), then to coder
            (plan exists, no code yet), then finish once both exist.
          - Never invent teammates that are not listed above.
        route_keys: {planner: plan, coder: code}
        done_keys: [plan, code]
        done_mode: all
        fallback: planner
        max_rounds: 6
      roles:
        planner:
          system: >-
            You are a senior planner. Break the user's request into a short,
            concrete implementation plan.

            Rules:
            - 3-5 bullet points, each one concrete and actionable.
            - Mention the functions/modules the coder should produce.
          output_key: plan
        coder:
          system: >-
            You are a senior developer. Implement the plan with clean,
            working code.

            Rules:
            - Follow the plan exactly.
            - Reply with the code in a fenced block and a one-line summary.
            - Never invent libraries or functions that don't exist.
          output_key: code
      finish:
        - llm:
            id: review_quality
            system: >-
              You are a strict code reviewer. Review the code and reply with
              a single JSON object:
              {{ "verdict": "pass" or "needs_work", "issues": [list of short problems to fix] }}.
            prompt: "Review the code:\n\n{code}\n\nReply with JSON."
            output_key: critique
            parse: true

  - transform: {id: extract_verdict, action: json_get, input_key: critique,
                field: verdict, output_key: verdict}

  - route:
      id: route
      routes:
        - {when: "verdict=pass", goto: approve}
        - {when: "verdict=needs_work", goto: refine}
      goto: refine

  - loop:
      key: verdict
      until: pass
      max_rounds: 3
      body:
        - transform: {action: pick, input_key: critique, field: issues,
                      output_key: issues, raw: true}
        - map:
            id: refine_map
            input_keys: [issues]
            output_key: fixes
            max_concurrency: 2
            processor:
              llm:
                system: "You fix exactly one code issue. Reply with only the corrected code."
                prompt: "Issue: {issues}\n\nCode:\n{code}"
                output_key: fix
        - transform: {action: join, input_key: fixes, sep: "\n\n",
                      output_key: fixes_text}
        - llm:
            system: >-
              You apply the reviewer's fixes to the existing code and reply
              with the full corrected code.
            prompt: "Fixes:\n{fixes_text}\n\nCurrent code:\n{code}"
            output_key: code
        - llm:
            system: >-
              You are a strict code reviewer. Return a single JSON object:
              {{ "verdict": "pass" or "needs_work", "issues": [list of problems to fix] }}.
            prompt: "Review the corrected code:\n\n{code}\n\nReply with JSON."
            output_key: critique
            parse: true
        - transform: {action: json_get, input_key: critique, field: verdict,
                      output_key: verdict}
      done:
        - interrupt:
            id: approve
            key: approved
            prompt: "Отправить код в работу? (approve / отлично / ok — да; любое другое — на доработку)"
            strategy:
              any_of: [approve, отлично, ok]
              decision_key: decision
              pass_value: approve
              fail_value: rework

  - route:
      key: decision
      routes:
        - {when: "decision=approve", goto: final}
        - {when: "decision=rework", goto: refine}
      goto: STOP

  - transform: {id: final, action: now, output_key: delivered_at}
