name: rag-pgvector
description: >
  RAG over the Teff knowledge base (docs.csv) using the PostgreSQL + pgvector store. Requires `teff[stores-pgvector]` (asyncpg + sqlalchemy) and a running PostgreSQL with the pgvector extension.

tools:
  - type: rag
    config:
      embedder:
        provider: ollama
        model: nomic-embed-text
      store:
        type: pgvector
        dsn: postgresql://postgres:postgres@localhost:5433/postgres
        table: teff_vectors
      documents:
        - type: csv
          path: ../docs.csv

state:
  initial:
    query: What is the mascot of Teff, and what does it ride?

providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat
steps:
  - agent_step:
      id: agent
      system: >
        You are a RAG assistant over the Teff knowledge base. Always call the 'rag' tool to search before answering, and answer strictly from the retrieved snippets.
      sections:
        query: "Query"
      output_key: answer
      use_tools: [rag]
      model: llama3.1:8b
      provider: ollama
