name: rag-chroma
description: >
  RAG over the Teff knowledge base (docs.csv) using the ChromaDB store. Requires `teff[stores-chroma]` (chromadb). Persists to a local directory.

tools:
  - type: rag
    config:
      embedder:
        provider: ollama
        model: nomic-embed-text
      store:
        type: chroma
        path: ./chroma_db
        collection: teff
      documents:
        - type: csv
          path: ../docs.csv

state:
  initial:
    query: What is the mascot of Teff, and what does it ride?

providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat
steps:
  - agent_step:
      id: agent
      system: >
        You are a RAG assistant over the Teff knowledge base. Always call the 'rag' tool to search before answering, and answer strictly from the retrieved snippets.
      sections:
        query: "Query"
      output_key: answer
      use_tools: [rag]
      model: llama3.1:8b
      provider: ollama
