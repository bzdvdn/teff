name: compose-everything
description: >
  A pure-YAML workflow (no API key) combining every pipeline-building block:
  an `include:` from another file, the new `transform` actions (split,
  contains, compare, replace, coalesce, join, to_int, now), a `loop` that
  retries until a condition holds, and a `branch` for dynamic routing — all
  driven from state.

state:
  initial:
    raw: "alpha,beta,urgent,gamma"
    attempts: "0"

include:
  - path: ./shared_metrics.yaml
    prefix: shared_

steps:
  - branch:
      key: has_urgent
      cases:
        - value: "true"
          steps:
            - type:
                type: loop
                config:
                  key: attempts
                  until: "3"
                  max_rounds: 5
                  body:
                    - {type: transform, action: to_int, input_key: attempts,
                       output_key: n}
                    - {type: transform, action: replace, input_key: raw,
                       old: "urgent", new: "p2", output_key: raw}
        - value: "false"
          steps:
            - transform: {id: quiet, action: value, value: no-urgent-items,
                          output_key: summary}
      converge:
        transform: {id: report, action: join, input_key: items, sep: " + ",
                    output_key: joined}

  - transform: {id: stamp, action: now, output_key: generated_at}
