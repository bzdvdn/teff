name: sentiment-router
description: >
  Classifies input text sentiment using Ollama, then routes to
  different branches (positive / negative) based on the result.
  Requires Ollama running locally with llama3.1:8b.

state:
  schema:
    messages:
      reducer: append
      type: list
  initial:
    text: I love this product!

default_provider: ollama
providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat
steps:
  - llm:
      id: classify
      model: llama3.1:8b
      provider: ollama
      system: >
        Classify the sentiment of the user's text. Respond with
        exactly one word: "positive" or "negative".
      input_key: text
      output_key: sentiment
  - branch:
      key: sentiment
      cases:
        - value: positive
          steps:
            - transform: {id: on_positive, action: value,
                          value: "Glad you liked it! ", output_key: reply}
        - value: negative
          steps:
            - transform: {id: on_negative, action: value,
                          value: "Sorry to hear that. ", output_key: reply}
      converge:
        transform: {id: shout, action: uppercase, input_key: reply,
                    output_key: result}
