name: plan_and_execute
description: >
  Plan-and-execute as pure YAML — no graph-building code.  An LLM plans a
  JSON object of steps, a Map fans them out to parallel executors, and a
  reviewer decides whether to accept or send control back to the planner:

    planner -> extract_steps -> [map] execute -> reviewer -> extract
                                                          |-- verdict=pass   --> final
                                                          |-- verdict!=pass  --> replan -> extract_steps -> [map] execute

  The planner/reviewer nodes use `parse: true` so their JSON responses are
  parsed into state before the transforms extract the steps array and the
  verdict string.

state:
  initial:
    goal: launch a blog about Python

default_provider: ollama
default_model: llama3.1:8b
providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    chat_path: /api/chat
steps:
  - transform: {id: kickoff, action: value, value: "", output_key: verdict}
  - loop:
      key: verdict
      until: pass
      body:
        - llm:
            id: planner
            system: >-
              You are a project planner. Respond with a single JSON object of
              the form {{"steps": ["step 1", "step 2", ...]}} with 2-3 concise
              step strings. No prose, only the JSON object.
            prompt: >-
              Plan a short list of steps to achieve: {goal}

              The reviewer said: {review}

              Respond with a revised JSON object if feedback was given.
            output_key: steps_obj
            parse: true
        - transform: {id: extract_steps, action: json_get, input_key: steps_obj,
                      field: steps, output_key: steps, raw: true}
        - map:
            id: execute
            input_keys: [steps]
            output_key: results
            max_concurrency: 2
            processor:
              llm:
                system: You are a step executor. Execute the single step and report what you did.
                prompt: "Execute this step: {steps}"
                output_key: result
        - llm:
            id: reviewer
            system: >-
              You are a quality reviewer. Review the step results and respond with
              a single JSON object:
              {{"verdict": "pass" or "needs_work", "feedback": "one short sentence"}}.
            prompt: "Review the results:\n\n{results}\n\nRespond with JSON."
            output_key: review
            parse: true
        - transform: {id: extract, action: json_get, input_key: review,
                      field: verdict, output_key: verdict}
      done:
        - llm:
            id: final
            system: You are the delivery lead. Summarize the completed work into a short report.
            prompt: "Summarize the outcome:\n\nResults: {results}"
            output_key: final
