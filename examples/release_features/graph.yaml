name: review-triage
description: >
  A tiny pure-transform workflow: normalises a customer review and emits
  a canned answer under the `answer` key.  No LLM required, so it runs
  anywhere — try `teff validate` and `teff eval` against it.
state:
  initial:
    review: "great service"
steps:
  - id: normalize
    type: transform
    config:
      action: lowercase
      input_key: review
      output_key: normalized
  - id: answer
    type: transform
    config:
      action: value
      input_key: review
      output_key: answer
      value: "positive"
edges:
  - from: normalize
    to: answer
