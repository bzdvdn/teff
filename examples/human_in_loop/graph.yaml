name: human-in-the-loop
state:
  schema:
    approved:
      reducer: override
      type: string
  initial:
    summ: 80000
steps:
  - id: draft
    type: llm_chat
    config:
      model: llama3.1:8b
      system: "Ты инженер по ремонту. Составляй краткие планы работ по-русски, 3-5 пунктов."
      prompt: "Составь план ремонта санузла на сумму {summ} рублей."
      output_key: draft
  - id: ask
    type: interrupt
    config:
      key: approved
      prompt: "Одобрить? (да / правки)"
  - id: final
    type: llm_chat
    config:
      model: llama3.1:8b
      system: "Ты инженер по ремонту. Составляй краткие планы работ по-русски, 3-5 пунктов."
      prompt: "Клиент одобрил план: {draft}\nВерни финальную версию плана."
      output_key: final
  - id: edit
    type: llm_chat
    config:
      model: llama3.1:8b
      system: "Ты инженер по ремонту. Составляй краткие планы работ по-русски, 3-5 пунктов."
      prompt: "Клиент отклонил план с правками: {approved}\n\nПлан: {draft}\n\nПереработай план с учётом правок клиента и верни новый план."
      output_key: draft
edges:
  - from: draft
    to: ask
  - from: ask
    to: final
    condition: "approved=да"
  - from: ask
    to: edit
    condition: "approved!=да"
  - from: edit
    to: ask
