name: declarative-checkpoint
description: >
  Durable run enabled by the checkpoint: block. State is saved before every
  node, so an interrupted run resumes from where it stopped instead of
  restarting. Re-running with the same --checkpoint-id continues (or resumes)
  that run.

  Interactively:
    teff run --file workflow.yaml --checkpoint-id demo --interactive
    # answer the gate question, e.g. "yes"
  Then resume from durable state:
    teff run --file workflow.yaml --checkpoint-id demo

checkpoint:
  type: sqlite
  path: data/checkpoints.db

state:
  schema:
    approved:
      reducer: override
      type: string
  initial:
    doc: "draft report"

steps:
  - transform: {id: write, action: uppercase, input_key: doc, output_key: report}
  - interrupt:
      id: gate
      key: approved
      prompt: "Approve the report? (yes / no)"
  - route:
      key: approved
      routes:
        - {when: "approved=yes", goto: ship}
      goto: STOP
  - transform: {id: ship, action: value, value: shipped, output_key: status}
