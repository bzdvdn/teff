name: hello-offline
description: >
  A deterministic, LLM-free workflow. Reads a note, counts its lines, and
  routes to a "single-line" or "multi-line" branch based on that number.

  No model, no network, no API key — run it anywhere:
      teff run --file workflow.yaml

state:
  initial:
    text: "just one line"

steps:
  - transform: {id: count, action: count_lines, input_key: text, output_key: lines}
  - branch:
      key: lines
      cases:
        - value: "1"
          steps:
            - transform: {id: single, action: value, value: single-line note,
                          output_key: note}
      default:
        - transform: {id: multi, action: value, value: multi-line note,
                      output_key: note}
      converge:
        transform: {id: status, action: value, value: done, output_key: status}
