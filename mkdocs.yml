site_name: Teff
site_description: Workflow as data, agents as graphs. Python async framework for durable AI agents and workflows.
repo_url: https://github.com/bzdvdn/teff
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            summary: true
            separate_signature: true
            line_length: 88

hooks:
  - docs/hooks.py

validation:
  nav:
    omitted_files: ignore

site_dir: site

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why Teff: why-teff.md
  - Getting started:
      - Install: getting-started/install.md
      - Learning path: getting-started/learning-path.md
      - Quick start: getting-started/quickstart.md
      - Tutorial: getting-started/tutorial.md
      - Anatomy of a run: getting-started/anatomy-of-a-run.md
      - Concepts: getting-started/concepts.md
  - Guide:
      - YAML workflows: guide/yaml-workflows.md
      - Choosing your abstraction: guide/choosing-your-abstraction.md
      - Core entities: guide/core-entities.md
      - Best practices: guide/best-practices.md
      - Flow builder: guide/flow-builder.md
      - Command routing: guide/commands.md
      - Agents: guide/agents.md
      - Multi-agent supervisors: guide/supervisors.md
      - Structured output: guide/structured-output.md
      - State: guide/state.md
      - Durable (checkpoints): guide/durable.md
      - Channels: guide/channels.md
      - RAG: guide/rag.md
      - Long-term memory: guide/memory.md
      - Skills: guide/skills.md
      - Plugins: guide/plugins.md
      - Evaluation: guide/evaluation.md
      - Streaming: guide/streaming.md
      - Logging: guide/logging.md
      - Errors & resilience: guide/errors.md
      - Troubleshooting: guide/troubleshooting.md
      - Observability: guide/observability.md
      - Testing: guide/testing.md
  - Recipes:
      - Overview: recipes/index.md
      - Fraud review: recipes/fraud-review.md
      - Release approval: recipes/release-approval.md
      - Support triage: recipes/support-triage.md
      - KB assistant: recipes/kb-assistant.md
      - Invoice processing: recipes/invoice-processing.md
